# On main: verify the frozen temporal fixture with the original pinned solver.
name: Temporal history inversion — pinned Operaattori
on:
  push:
    branches: [main, feature/temporal-history-inference]
    paths:
      - '.github/workflows/temporal.yml'
      - 'experiments/temporal_gate.py.zlib'
      - 'experiments/temporal_gate.py'
      - 'data/temporal_reference.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  temporal-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out MondayRepo
        uses: actions/checkout@v4
      - name: Check out original pinned Operaattori
        uses: actions/checkout@v4
        with:
          repository: anttiluode/Operaattori
          ref: f2398939dc2ef2ec829093953c20637c74e82cd0
          path: upstream/Operaattori
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.1.3
      - name: Materialize transparent source on first branch run
        if: github.ref == 'refs/heads/feature/temporal-history-inference'
        shell: bash
        run: |
          if [ -f experiments/temporal_gate.py.zlib ]; then
            python - <<'PY'
          from pathlib import Path
          import zlib
          payload=Path('experiments/temporal_gate.py.zlib').read_bytes()
          source=zlib.decompress(payload)
          if not source.startswith(b'#!/usr/bin/env python3'):
              raise ValueError('Unexpected source archive')
          Path('experiments/temporal_gate.py').write_bytes(source)
          Path('experiments/temporal_gate.py.zlib').unlink()
          print('Reconstructed reproducible Python source',len(source),'bytes')
          PY
          fi
      - name: Assert exact source provenance
        run: |
          test "$(git -C upstream/Operaattori rev-parse HEAD)" = "f2398939dc2ef2ec829093953c20637c74e82cd0"
          test "$(git -C upstream/Operaattori hash-object reduced/causal_graph_circuit.py)" = "433621a1a5a39a6ea3c2dcf47082c8e2a9085a47"
          echo "Original upstream source identity verified"
      - name: Generate or check held-out temporal predictions
        shell: bash
        run: |
          if [ -f experiments/temporal_gate.py.zlib ]; then
            echo 'Source archive unexpectedly remains'; exit 1
          fi
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            python experiments/temporal_gate.py --operaattori upstream/Operaattori --check data/temporal_reference.json
          elif [ -f data/temporal_reference.json ]; then
            python experiments/temporal_gate.py --operaattori upstream/Operaattori --check data/temporal_reference.json
          else
            python experiments/temporal_gate.py --operaattori upstream/Operaattori --out data/temporal_reference.json
          fi
      - name: Save generated source and upstream data in review branch
        if: github.ref == 'refs/heads/feature/temporal-history-inference'
        run: |
          git add -A experiments data/temporal_reference.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Materialize original-runtime temporal gate and its results [skip ci]"
            git push origin HEAD:feature/temporal-history-inference
          fi
      - name: Check numeric temporal gate criteria
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          f=json.loads(Path('data/temporal_reference.json').read_text())
          m=f['mean_holdout_rmse_mV']
          print('RMSE (mV):',m)
          print('Wins across 8 held-out splits:',f['wins'])
          assert m['quadratic_history'] < m['linear_history'] < m['instant']
          assert f['matched_soma']['preprobe_abs_error_mV'] < 1e-7
          assert f['matched_soma']['max_probe_increment_difference_mV'] > 1.0
          print('PASS temporal known-input prediction and snapshot nonidentifiability')
          PY
      - name: Check original and temporal browser fixture tests
        run: |
          node --version
          node --test tests/*.test.mjs
